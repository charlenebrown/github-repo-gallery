<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Repo Gallery</title>
  <link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Oswald:wght@500&display=swap">
<link
  rel="stylesheet"
  href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
  integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p"
  crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Explore a GitHub profile, browse repositories, and view repository details.">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <div class="badge" aria-hidden="true">
  <div class="circle"></div>
</div>

<header>
  <h1>
    <i class="fab fa-github-alt" aria-hidden="true"></i>
    GitHub Repo Gallery
  </h1>
</header>

<main class="page">
 <section
  class="user-info"
  aria-labelledby="profile-heading"
  hidden
>
  <h2 id="profile-heading" class="visually-hidden">
    GitHub profile
  </h2>

  <img class="user-avatar" alt="">

  <div class="user-details">
    <p class="user-name">
      <strong><span></span></strong>
    </p>

    <p class="user-bio">
      <span></span>
    </p>

    <p class="user-location">
      Location: <span></span>
    </p>

    <p class="user-stats">
      Public repos: <span></span>
    </p>

    <hr>
  </div>
</section>

<section class="repos" aria-labelledby="gallery-heading">
  <h2 id="gallery-heading" class="visually-hidden">
    Repository gallery
  </h2>
    <div class="search">
      <label for="filter-repos">Search repositories</label>

      <input
        type="text"
        id="filter-repos"
        class="filter-repos"
        placeholder="Search by repository name"
      >

      <i class="fas fa-search" aria-hidden="true"></i>
    </div>

    <ul class="repo-list"></ul>
  </section>

  <div class="repo-details">
  <section
    class="repo-data hide"
    aria-labelledby="repo-detail-name"
  ></section>

  <div class="repo-actions">
    <button type="button" class="back-to-gallery hide">
      Back to Repo Gallery
    </button>
  </div>
</div>
</main>

  <script src="js/app.js"></script>

</body>

</html>
